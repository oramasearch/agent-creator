[project]
name = "agent-creator"
version = "0.1.0"
description = "AgentCreator: the Agent Factory's agent, a definition that runs on agent-runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openai>=2.53.0", "httpx>=0.28.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["definition", "."]
